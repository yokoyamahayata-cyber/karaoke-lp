<title>精密採点90点 無料LINEレッスン</title>
<meta property="og:title" content="精密採点90点を狙う 無料LINEレッスン">
<meta property="og:description" content="ビブラート・発声・練習のやり方を、毎日1通で。登録0円。">
<meta name="robots" content="noindex">

<style>
  html,body{margin:0;height:100%;background:#eef1f5}
  .boot{position:fixed;inset:0;display:grid;place-items:center;color:#9aa3b5;font-family:"Zen Maru Gothic","Hiragino Sans",sans-serif;font-size:.9rem}
</style>
</head>
<body>
<div class="boot">読み込み中…</div>
<script>
/* ===== A/Bテスト振り分け: 同じURLで a/b/c をランダム表示。同じ訪問者には同じパターンを固定。 ===== */
(function(){
  var KEY='klp_ab', POOL=['a','b','c'];
  var forced=(location.search.match(/[?&]v=([abc])/)||[])[1];      // ?v=a で特定パターンを強制（確認用）
  var v;
  try{ v=localStorage.getItem(KEY); }catch(e){}
  if(forced){ v=forced; }
  if(!v || POOL.indexOf(v)<0){ v=POOL[Math.floor(Math.random()*POOL.length)]; }
  try{ localStorage.setItem(KEY,v); }catch(e){}
  fetch('variants/'+v+'.html',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(html){
      html=html.replace(/\.\.\/img\//g,'img/');   // variantsの ../img/ をトップ基準 img/ に補正
      document.open(); document.write(html); document.close();
    })
    .catch(function(){ location.replace('variants/'+v+'.html'); });  // 取得失敗時はそのページへ遷移
})();
</script>
</body>
</html>
